<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Panel v2 — Reference</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #090b10; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #222a3a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #2e3848; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;
const { createPortal } = ReactDOM;

/* ═══════════════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
const T = {
  bg:"#090b10", surface:"#0d1017", card:"#111620", cardAlt:"#151b28",
  border:"#1a2030", borderMd:"#232e40", borderLt:"#2e3a4e",
  text:"#e3e6ec", textSec:"#b4b9c8", textMut:"#8892a8", textDim:"#5e6880", textFaint:"#343e52",
  accent:"#7e8ef8", accentDim:"#5264c8",
  cyan:"#22d3ee", green:"#36d49a", red:"#f87171", amber:"#fbbf24",
  blue:"#60a5fa", purple:"#a78bfa", indigo:"#818cf8",
};
const F='"DM Sans",-apple-system,sans-serif';
const M='"JetBrains Mono",monospace';
const PW=480, G=18, LW=170, BH=34, ROW_H=36, MAX_ROWS=8.5;

/* ── SDA Types ── */
const SDA={
  full:     {c:'#7e8ef8',label:'Extraction + Inference',short:'FULL',
    tip:'Full access. Evaluator can run both extraction and inference requirements against the evidence.',
    permTip:'Evaluator has full access — can extract specific values and run inference checks.'},
  selective:{c:'#fbbf24',label:'Inference only',short:'SELECTIVE',
    tip:'Selective access. Evaluator can only run inference requirements — no raw data extraction.',
    permTip:'Evaluator can run inference checks (yes/no/valid) but cannot extract specific values.'},
  proofonly:{c:'#36d49a',label:'POE pass/fail only',short:'PROOF-ONLY',
    tip:'Proof-only. Recipient receives a pass/fail result from a prior evaluation — no evaluator access.',
    permTip:'Recipient sees only a pass/fail badge from a prior evaluation. No new evaluation possible.'},
  cascade:  {c:'#a78bfa',label:'Cascaded access',short:'CASCADE',
    tip:'Cascade disclosure. Access was passed through an intermediary — not directly from the asset owner. Permission is constrained by the upstream SDA.',
    permTip:'Permission was received through a cascade chain. The intermediary cannot grant more access than they received.'},
};

const CAT={
  person:{i:"●",c:T.cyan}, party:{i:"⬡",c:T.indigo}, place:{i:"◆",c:T.green},
  product:{i:"■",c:T.blue}, process:{i:"◎",c:T.amber},
};

/* ═══════════════════════════════════════════════════════════════════════
   ICONS
   ═══════════════════════════════════════════════════════════════════════ */
const Ico={
  Check:({s=13,c=T.green})=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{flexShrink:0}}><path d="M3.5 8.5L6.5 11.5L12.5 4.5" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  X:({s=13,c=T.red})=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{flexShrink:0}}><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke={c} strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Doc:({s=20})=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{flexShrink:0,opacity:0.5}}><path d="M4 1h5.5L13 4.5V14a1 1 0 01-1 1H4a1 1 0 01-1-1V2a1 1 0 011-1z" stroke={T.textMut} strokeWidth="1" fill="none"/><path d="M9 1v4h4" stroke={T.textMut} strokeWidth="1" fill="none" strokeLinejoin="round"/><line x1="5" y1="8.5" x2="11" y2="8.5" stroke={T.textFaint} strokeWidth="0.7"/><line x1="5" y1="10.5" x2="9" y2="10.5" stroke={T.textFaint} strokeWidth="0.7"/></svg>,
  Clip:({s=14,c=T.textDim})=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{flexShrink:0}}><path d="M10.5 4.5v6a3 3 0 01-6 0v-7a2 2 0 014 0v6.5a1 1 0 01-2 0V5" stroke={c} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Chain:({s=14,c=T.purple})=><svg width={s} height={s} viewBox="0 0 16 16" fill="none" style={{flexShrink:0}}><path d="M6.5 9.5l3-3" stroke={c} strokeWidth="1.2" strokeLinecap="round"/><path d="M9 7l2.5-2.5a1.5 1.5 0 00-2.12-2.12L7 4.75" stroke={c} strokeWidth="1.2" strokeLinecap="round"/><path d="M7 9l-2.5 2.5a1.5 1.5 0 002.12 2.12L9 11.25" stroke={c} strokeWidth="1.2" strokeLinecap="round"/></svg>,
};

/* ═══════════════════════════════════════════════════════════════════════
   TOOLTIP SYSTEM
   ═══════════════════════════════════════════════════════════════════════ */
function TT({text,anchorRef,w}){
  const r=useCallback(el=>{if(el&&anchorRef.current){const b=anchorRef.current.getBoundingClientRect();const ew=el.offsetWidth;let left=b.left+b.width/2-ew/2;if(left+ew>window.innerWidth-12)left=window.innerWidth-ew-12;if(left<12)left=12;el.style.left=left+"px";el.style.top=(b.bottom+8)+"px"}},[]);
  return createPortal(<div ref={r} style={{position:"fixed",left:-9999,top:-9999,padding:"8px 12px",background:"#182030",border:`1px solid ${T.borderMd}`,borderRadius:6,fontSize:11,fontFamily:M,color:T.textSec,zIndex:999999,boxShadow:"0 8px 28px rgba(0,0,0,0.55)",pointerEvents:"none",lineHeight:1.6,whiteSpace:"normal",width:w||"auto",maxWidth:280}}>{text}</div>,document.body);
}
function Tip({text,children,w}){const[s,ss]=useState(false);const r=useRef(null);return(<span ref={r} onMouseEnter={()=>ss(true)} onMouseLeave={()=>ss(false)} style={{display:"inline-flex",alignItems:"center",cursor:"default"}}>{children}{s&&r.current&&<TT text={text} anchorRef={r} w={w}/>}</span>);}

/* ═══════════════════════════════════════════════════════════════════════
   BADGES & PRIMITIVES
   ═══════════════════════════════════════════════════════════════════════ */
function CopyBadge({value,truncated}){
  const[c,sc]=useState(false);const d=truncated?value.slice(0,8)+"..."+value.slice(-4):value;
  const cp=e=>{e.stopPropagation();sc(true);setTimeout(()=>sc(false),1500);try{navigator.clipboard.writeText(value)}catch(e){}};
  return <span onClick={cp} style={{display:"inline-flex",alignItems:"center",padding:"3px 8px",borderRadius:4,fontSize:11,fontFamily:M,color:c?T.green:T.textMut,background:c?`color-mix(in srgb,${T.green} 6%,transparent)`:T.bg,border:`1px solid ${c?T.green:T.border}`,cursor:"pointer",transition:"all 180ms",whiteSpace:"nowrap"}} title="Click to copy">{c?"✓ Copied":d}</span>;
}
function SDABadge({type}){const s=SDA[type]||SDA.full;const bs=type==='full'?'solid':type==='proofonly'?'dotted':type==='cascade'?'dashed':'dashed';return <Tip text={s.tip} w={260}><span style={{padding:"3px 8px",borderRadius:4,fontSize:10.5,fontFamily:M,fontWeight:600,background:`color-mix(in srgb,${s.c} 10%,transparent)`,color:s.c,border:`1px ${bs} color-mix(in srgb,${s.c} 45%,transparent)`,whiteSpace:"nowrap",letterSpacing:"0.02em"}}>{s.short}</span></Tip>;}
function Badge({text,color,tooltip}){const inner=<span style={{padding:"3px 8px",borderRadius:4,fontSize:10.5,fontFamily:M,fontWeight:600,background:`color-mix(in srgb,${color} 10%,transparent)`,color,border:`1px solid color-mix(in srgb,${color} 22%,transparent)`,whiteSpace:"nowrap"}}>{text}</span>;return tooltip?<Tip text={tooltip} w={220}>{inner}</Tip>:inner;}

/* ── Health Bar ── */
function Seg({pct,color,label}){const[s,ss]=useState(false);const r=useRef(null);return <div ref={r} onMouseEnter={()=>ss(true)} onMouseLeave={()=>ss(false)} style={{width:`${pct}%`,minWidth:5,height:"100%",background:color,borderRadius:2,cursor:"default"}}>{s&&r.current&&<TT text={label} anchorRef={r}/>}</div>;}
function HealthBar({health}){const t=health.ok+health.bad;if(!t)return <div style={{height:7,borderRadius:4,background:T.border,width:"100%"}}/>;return <div style={{display:"flex",alignItems:"center",width:"100%"}}><div style={{flex:1,height:7,borderRadius:4,background:T.border,display:"flex",gap:2,overflow:"visible"}}>{health.ok>0&&<Seg pct={(health.ok/t)*100} color={T.green} label={`${health.ok} verified`}/>}{health.bad>0&&<Seg pct={(health.bad/t)*100} color={T.red} label={`${health.bad} failed`}/>}</div></div>;}

/* ── Stat Pills ── */
function SC({n,l}){if(!n)return null;return <Tip text={`${n} ${l||"verified"}`}><span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 7px",borderRadius:5,background:`color-mix(in srgb,${T.green} 8%,transparent)`}}><Ico.Check s={11} c={T.green}/><span style={{fontSize:12,fontFamily:M,fontWeight:700,color:T.green}}>{n}</span></span></Tip>;}
function SX({n,l}){if(!n)return null;return <Tip text={`${n} ${l||"failed"}`}><span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 7px",borderRadius:5,background:`color-mix(in srgb,${T.red} 8%,transparent)`}}><Ico.X s={11} c={T.red}/><span style={{fontSize:12,fontFamily:M,fontWeight:700,color:T.red}}>{n}</span></span></Tip>;}

/* ── Layout ── */
function GR({label,value,vc,labelTip}){const lbl=labelTip?<Tip text={labelTip} w={220}><span style={{borderBottom:`1px dashed ${T.textFaint}`,cursor:"default"}}>{label}</span></Tip>:label;return <div style={{display:"flex",alignItems:"center",minHeight:32,borderBottom:`1px solid ${T.border}`}}><div style={{width:LW,flexShrink:0,fontSize:11,color:T.textDim,paddingLeft:8}}>{lbl}</div><div style={{flex:1,fontSize:11,fontFamily:M,color:vc||T.textMut,overflow:"hidden",textOverflow:"ellipsis"}}>{value}</div></div>;}
function Chev({open}){return <span style={{fontSize:11,color:T.textDim,transition:"transform 180ms ease",transform:open?"rotate(90deg)":"rotate(0)",display:"inline-block",marginLeft:2}}>▸</span>;}
function Btn({label,onClick,disabled,accent,style:sx}){const[h,sh]=useState(false);const c=disabled?T.textFaint:accent?T.accent:T.textMut;const bc=disabled?T.border:accent?`color-mix(in srgb,${T.accent} 40%,transparent)`:T.border;return <button onClick={disabled?undefined:onClick} onMouseEnter={()=>!disabled&&sh(true)} onMouseLeave={()=>sh(false)} style={{height:BH,padding:"0 14px",borderRadius:5,border:`1px solid ${h&&!disabled?T.borderLt:bc}`,background:h&&!disabled?(accent?`color-mix(in srgb,${T.accent} 7%,transparent)`:T.cardAlt):"transparent",color:c,fontSize:11,fontFamily:M,fontWeight:500,cursor:disabled?"default":"pointer",transition:"all 180ms",opacity:disabled?0.3:1,whiteSpace:"nowrap",display:"flex",alignItems:"center",justifyContent:"center",...(sx||{})}}>{label}</button>;}
function TinyBtn({icon,tip,onClick}){return <Tip text={tip}><span onClick={e=>{e.stopPropagation();onClick&&onClick()}} style={{fontSize:11,fontFamily:M,color:T.textDim,cursor:"pointer",padding:"2px 6px",borderRadius:4,transition:"color 150ms,background 150ms"}} onMouseEnter={e=>{e.target.style.color=T.text;e.target.style.background=T.cardAlt}} onMouseLeave={e=>{e.target.style.color=T.textDim;e.target.style.background="transparent"}}>{icon}</span></Tip>;}

/* ═══════════════════════════════════════════════════════════════════════
   CLAIMS TABLE (with keyboard nav, sticky header, scrollable body)
   ═══════════════════════════════════════════════════════════════════════ */
function TruncCell({text,bad,width}){const ref=useRef(null);const[trunc,setTrunc]=useState(false);useEffect(()=>{if(ref.current)setTrunc(ref.current.scrollWidth>ref.current.clientWidth)},[text]);const inner=<div ref={ref} style={{width,flexShrink:0,fontSize:11,color:bad?T.red:T.text,paddingLeft:8,display:"flex",alignItems:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{text}</div>;return trunc?<Tip text={text} w={260}>{inner}</Tip>:inner;}
function ClaimCell({out,type,bad}){const ref=useRef(null);const[trunc,setTrunc]=useState(false);const full=`${out} ${type==="inferred"?"inferred":"direct"}`;useEffect(()=>{if(ref.current)setTrunc(ref.current.scrollWidth>ref.current.clientWidth)},[out,type]);const inner=<div ref={ref} style={{flex:1,fontSize:11,fontFamily:M,display:"flex",alignItems:"center",gap:6,paddingLeft:10,borderLeft:`1px solid ${T.border}`,overflow:"hidden",whiteSpace:"nowrap"}}><span style={{color:bad?T.red:T.text,overflow:"hidden",textOverflow:"ellipsis"}}>{out}</span><span style={{fontSize:10,color:T.textDim,flexShrink:0}}>{type==="inferred"?"inferred":"direct"}</span></div>;return trunc?<Tip text={full} w={240}>{inner}</Tip>:inner;}
function ClaimsTable({claims}){
  const[focusIdx,setFocusIdx]=useState(-1);const tableRef=useRef(null);const scrollRef=useRef(null);
  const handleKey=useCallback(e=>{if(e.key==="ArrowDown"){e.preventDefault();setFocusIdx(p=>Math.min(p+1,claims.length-1))}else if(e.key==="ArrowUp"){e.preventDefault();setFocusIdx(p=>Math.max(p-1,0))}else if(e.key==="Home"){e.preventDefault();setFocusIdx(0)}else if(e.key==="End"){e.preventDefault();setFocusIdx(claims.length-1)}},[claims.length]);
  useEffect(()=>{if(focusIdx>=0&&scrollRef.current){const row=scrollRef.current.children[focusIdx];if(row)row.scrollIntoView({block:"nearest"})}},[focusIdx]);
  const maxH=ROW_H*MAX_ROWS;const needsScroll=claims.length>MAX_ROWS;
  return <div ref={tableRef} tabIndex={0} onKeyDown={handleKey} onFocus={()=>{if(focusIdx<0)setFocusIdx(0)}} onBlur={()=>setFocusIdx(-1)} style={{borderRadius:6,overflow:"hidden",border:`1px solid ${T.border}`,background:T.bg,outline:"none"}}>
    <div style={{display:"flex",alignItems:"stretch",height:34,background:T.card,borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,zIndex:2}}>
      <div style={{width:LW,flexShrink:0,fontSize:10.5,fontFamily:M,fontWeight:600,color:T.textDim,letterSpacing:"0.02em",paddingLeft:8,display:"flex",alignItems:"center"}}>Requirement</div>
      <div style={{flex:1,fontSize:10.5,fontFamily:M,fontWeight:600,color:T.textDim,letterSpacing:"0.02em",paddingLeft:10,borderLeft:`1px solid ${T.borderMd}`,display:"flex",alignItems:"center"}}>Claim</div>
      <div style={{width:86,fontSize:10.5,fontFamily:M,fontWeight:600,color:T.textDim,letterSpacing:"0.02em",paddingLeft:10,borderLeft:`1px solid ${T.borderMd}`,display:"flex",alignItems:"center"}}>Result</div>
    </div>
    <div ref={scrollRef} style={{maxHeight:needsScroll?maxH:"none",overflowY:needsScroll?"auto":"visible"}}>
    {claims.map((c,i)=>{const bad=c.st==="contested";const focused=i===focusIdx;return <div key={i}>
      <div style={{display:"flex",alignItems:"stretch",minHeight:ROW_H,borderBottom:(!bad&&i<claims.length-1)?`1px solid ${T.border}`:"none",transition:"background 100ms",background:focused?T.cardAlt:"transparent",outline:focused?`1px solid ${T.borderLt}`:"none",outlineOffset:"-1px"}} onMouseEnter={e=>{if(!focused)e.currentTarget.style.background=T.card}} onMouseLeave={e=>{if(!focused)e.currentTarget.style.background="transparent"}} onClick={()=>setFocusIdx(i)}>
        <TruncCell text={c.req} bad={bad} width={LW}/>
        <ClaimCell out={c.out} type={c.type} bad={bad}/>
        <div style={{width:86,display:"flex",alignItems:"center",gap:4,paddingLeft:10,borderLeft:`1px solid ${T.border}`}}>{bad?<><Ico.X s={11}/><span style={{fontSize:10.5,fontFamily:M,color:T.red}}>Failed</span></>:<><Ico.Check s={11}/><span style={{fontSize:10.5,fontFamily:M,color:T.green}}>Verified</span></>}</div>
      </div>
      {bad&&c.dispute&&<div style={{padding:"10px 14px 12px",borderBottom:i<claims.length-1?`1px solid ${T.border}`:"none",background:`color-mix(in srgb,${T.red} 3%,transparent)`}}>
        <div style={{fontSize:11,color:T.red,fontFamily:M}}>Disputed by {c.dispute.by} · {c.dispute.date}</div>
        <div style={{fontSize:11,color:T.textMut,marginTop:4,lineHeight:1.5}}>{c.dispute.reason}</div>
        <div style={{marginTop:6}}><span style={{fontSize:11,fontFamily:M,fontWeight:600,color:T.red,cursor:"pointer",borderBottom:"1px solid transparent",transition:"border-color 150ms"}} onMouseEnter={e=>e.target.style.borderBottomColor=T.red} onMouseLeave={e=>e.target.style.borderBottomColor="transparent"}>Review dispute →</span></div>
      </div>}
    </div>})}
    </div>
  </div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   EVAL PANEL
   ═══════════════════════════════════════════════════════════════════════ */
function EvalPanel({ev,open,onToggle,clOpen,onToggleCl}){
  const sup=ev.status==="superseded";const vn=ev.claims.filter(c=>c.st==="verified").length;const cn=ev.claims.filter(c=>c.st==="contested").length;
  return <div style={{background:T.card,borderRadius:8,border:`1px solid ${T.border}`,marginTop:10,opacity:sup?0.4:1,transition:"opacity 200ms"}}>
    <div onClick={onToggle} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",cursor:"pointer",borderRadius:open?"8px 8px 0 0":"8px",background:open?T.cardAlt:"transparent",transition:"background 150ms"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}><span style={{fontSize:13,fontWeight:600,color:T.text}}>{ev.org}</span>{sup&&<Badge text="SUPERSEDED" color={T.textDim} tooltip="Replaced by newer evaluation. Preserved for audit."/>}</div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}><span style={{fontSize:11,fontFamily:M,color:T.textDim}}>{ev.date}</span>{!sup&&<SC n={vn} l="verified"/>}{!sup&&<SX n={cn} l="failed"/>}<Chev open={open}/></div>
    </div>
    {open&&<div style={{padding:"4px 14px 16px"}}>
      <div style={{fontSize:11,fontFamily:M,color:T.accent,fontWeight:600,marginTop:8,marginBottom:14}}>{ev.id}</div>
      <GR label="Party DOT" labelTip="Data Object Title — a unique on-chain identifier for this organization. Used to verify the evaluating party's identity." value={<CopyBadge value={ev.dot}/>}/>
      <GR label="Requirements" value={ev.reqs} vc={T.accent}/>
      <GR label="Reviewer" value={`${ev.reviewer} · ${ev.revDate}`} vc={T.green}/>
      <GR label="Credits" value={String(ev.credits)}/>
      {ev.claims.length>0&&<div style={{marginTop:18}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <div onClick={e=>{e.stopPropagation();onToggleCl()}} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}><span style={{fontSize:12,fontFamily:M,fontWeight:700,color:T.textMut,letterSpacing:"0.05em"}}>RESULTS</span><span style={{fontSize:12,fontFamily:M,color:T.textDim}}>{ev.claims.length}</span><Chev open={clOpen}/></div>
          <div style={{flex:1}}/><TinyBtn icon="⛶" tip="Expand results in modal" onClick={()=>alert("Expand modal (demo)")}/><TinyBtn icon="↓" tip="Download results as CSV" onClick={()=>alert("Download CSV (demo)")}/>
        </div>
        {clOpen&&<ClaimsTable claims={ev.claims}/>}
      </div>}
      {sup&&ev.claims.length===0&&<div style={{fontSize:11,color:T.textDim,marginTop:14,fontFamily:M}}>Claims from this evaluation are no longer active.</div>}
    </div>}
  </div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   EVIDENCE BLOCK (collapsible)
   ═══════════════════════════════════════════════════════════════════════ */
function EvidenceBlock({ev,open,onToggle}){
  const bodyRef=useRef(null);const[height,setHeight]=useState(0);
  useEffect(()=>{if(open&&bodyRef.current)setHeight(bodyRef.current.scrollHeight)},[open]);
  return <div style={{background:T.card,borderRadius:8,border:`1px solid ${T.border}`,marginBottom:22}}>
    <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",cursor:"pointer",borderRadius:open?"8px 8px 0 0":"8px",background:open?T.cardAlt:"transparent",transition:"background 150ms"}}>
      <Ico.Doc s={20}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:T.text}}>{ev.filename}</div><div style={{fontSize:11,fontFamily:M,color:T.textDim,marginTop:1}}>{ev.block}</div></div><Chev open={open}/>
    </div>
    <div style={{overflow:"hidden",maxHeight:open?height||500:0,transition:"max-height 250ms ease",opacity:open?1:0}}>
      <div ref={bodyRef} style={{padding:"4px 16px 16px"}}>
        <GR label="SHA-256" value={<CopyBadge value={ev.hash} truncated/>}/>
        <GR label="Status" value={<span style={{color:T.green,fontWeight:600,fontSize:11,fontFamily:M}}>VERIFIED</span>}/>
        <GR label="On-chain ref" value={ev.block}/>
        <GR label="Provider" value={ev.provider}/>
        <GR label="Reference URI" value={<CopyBadge value={ev.uri} truncated/>}/>
        <GR label="Access level" value={<Badge text={ev.access} color={T.accent}/>}/>
        <GR label="Retention" value={ev.retention}/>
      </div>
    </div>
  </div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   DISCLOSURES TAB (shared — handles cascade chain display)
   ═══════════════════════════════════════════════════════════════════════ */
const WARN={
  full:{t:"⚠ Ownership disclosure",m:"You are the sole owner. Revoking will archive this asset, terminate downstream disclosures, and remove it from your network."},
  selective:{t:"⚠ Selective disclosure",m:"Revoking removes the recipient's ability to run inference requirements. Existing results on their network will be marked as revoked."},
  proofonly:{t:"⚠ Proof-only disclosure",m:"Revoking invalidates the POE shared with this party. Their badge will be marked as revoked."},
  cascade:{t:"⚠ Cascade disclosure",m:"Revoking removes your cascaded access to this asset. If the upstream SDA between the intermediary and the owner is also revoked, this cascade is automatically invalidated — two points of failure."},
};

function DisclTab({sdas}){
  const[exp,sExp]=useState(null);const[rev,sRev]=useState(null);
  const expandAll=()=>{sExp(-1)};/* -1 = special: we'll check differently */
  const collapseAll=()=>{sExp(null);sRev(null)};
  const[allOpen,sAllOpen]=useState(false);

/* ═══════════════════════════════════════════════════════════════════════
   CHILDREN TAB (handles sub-components + evidence children)
   ═══════════════════════════════════════════════════════════════════════ */
function ChildHealthBar({children}){
  const total=children.reduce((s,ch)=>s+ch.health.ok+ch.health.bad,0);
  if(!total)return null;
  return <div style={{marginBottom:16}}>
    <div style={{fontSize:10,fontFamily:M,color:T.textDim,letterSpacing:"0.04em",marginBottom:6}}>HEALTH BY CHILD</div>
    <div style={{display:"flex",height:7,borderRadius:4,background:T.border,gap:6,overflow:"visible"}}>
      {children.map((ch,i)=>{const ct=ch.health.ok+ch.health.bad;if(!ct)return null;const pct=(ct/total)*100;const okPct=ct>0?(ch.health.ok/ct)*100:0;const label=`${ch.name}: ${ch.health.ok} verified${ch.health.bad>0?` · ${ch.health.bad} failed`:""}`;
        return <BarSeg key={i} pct={pct} okPct={okPct} label={label} hasBad={ch.health.bad>0}/>;
      })}
    </div>
  </div>;
}
function BarSeg({pct,okPct,label,hasBad}){const[s,ss]=useState(false);const r=useRef(null);return <div ref={r} onMouseEnter={()=>ss(true)} onMouseLeave={()=>ss(false)} style={{width:`${pct}%`,minWidth:10,height:7,display:"flex",gap:2,cursor:"default",flexShrink:0}}>{s&&r.current&&<TT text={label} anchorRef={r} w={220}/>}<div style={{width:hasBad?`${okPct}%`:"100%",minWidth:2,height:"100%",background:T.green,borderRadius:3}}/>{hasBad&&<div style={{width:`${100-okPct}%`,minWidth:2,height:"100%",background:T.red,borderRadius:3}}/>}</div>;}
function ChildTab({children}){
  const[exp,sExp]=useState(()=>{const o={};children.forEach((_,i)=>{o[i]=i===0});return o});
  const expandAll=()=>{const o={};children.forEach((_,i)=>{o[i]=true});sExp(o)};
  const collapseAll=()=>{const o={};children.forEach((_,i)=>{o[i]=false});sExp(o)};
  return <div>
    <div style={{display:"flex",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:11,color:T.textMut,lineHeight:1.7,flex:1}}>Child assets of this node.</div>
      <div style={{display:"flex",alignItems:"center",gap:2}}><TinyBtn icon="⊞" tip="Expand all" onClick={expandAll}/><TinyBtn icon="⊟" tip="Collapse all" onClick={collapseAll}/></div>
    </div>
    <ChildHealthBar children={children}/>
    {children.map((ch,i)=>{
      const c=CAT[ch.category]||CAT.product;const o=exp[i];const diffOwner=ch.owner!==ch.parentOwner;
      return <div key={i} style={{background:T.card,borderRadius:8,border:`1px solid ${T.border}`,marginBottom:10}}>
        <div onClick={()=>sExp(p=>({...p,[i]:!p[i]}))} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",cursor:"pointer",borderRadius:o?"8px 8px 0 0":"8px",background:o?T.cardAlt:"transparent",transition:"background 150ms"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:c.c}}>{c.i}</span>
            <span style={{fontSize:13,fontWeight:600,color:T.text}}>{ch.name}</span>
            {ch.hasEvidence&&<Tip text="Has attached evidence"><Ico.Clip s={13} c={T.textDim}/></Tip>}
            {ch.isCascade&&<Tip text="Received via cascade disclosure"><Ico.Chain s={13} c={T.purple}/></Tip>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}><SC n={ch.health.ok} l="verified"/>{ch.health.bad>0&&<SX n={ch.health.bad} l="failed"/>}<Chev open={o}/></div>
        </div>
        {o&&<div style={{padding:"6px 14px 16px"}}>
          <GR label="PIN" value={<CopyBadge value={ch.pin} truncated/>}/>
          <div style={{display:"flex",alignItems:"flex-start",minHeight:44,borderBottom:`1px solid ${T.border}`,paddingTop:6,paddingBottom:6}}><div style={{width:LW,flexShrink:0,fontSize:11,color:T.textDim,paddingLeft:8,paddingTop:4}}>Owner</div><div style={{flex:1,display:"flex",flexDirection:"column",gap:4,alignItems:"flex-start"}}><span style={{fontSize:11,fontFamily:M,color:diffOwner?T.amber:T.textMut}}>{ch.owner}</span>{ch.ownerDot&&<CopyBadge value={ch.ownerDot}/>}</div></div>

          {ch.isCascade&&<GR label="Via" value={<span style={{color:T.purple}}>{ch.cascadeVia}</span>}/>}

}
