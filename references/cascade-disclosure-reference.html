<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant — Cascade Disclosure Reference</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;text-wrap:pretty}
::selection{background:rgba(126,142,248,.3)}
body{background:#090b10;color:#e3e6ec;font-family:'DM Sans',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2e3a4e;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect}=React;

const T={
  bg:"#090b10",surface:"#0d1017",card:"#111620",cardAlt:"#151b28",raised:"#1a2030",
  border:"#1a2030",borderMd:"#232e40",borderLt:"#2e3a4e",
  text:"#e3e6ec",textSec:"#b4b9c8",textMut:"#8892a8",textDim:"#5e6880",textFaint:"#343e52",
  accent:"#7e8ef8",green:"#36d49a",red:"#f87171",amber:"#fbbf24",blue:"#60a5fa",
  cyan:"#22d3ee",purple:"#a78bfa",indigo:"#818cf8",
};
const F="'DM Sans',sans-serif";
const M="'JetBrains Mono',monospace";
const SDA_COLORS={full:"#7e8ef8",selective:"#fbbf24",proofonly:"#36d49a",cascade:"#a78bfa"};
const SDA_LABELS={full:"FULL",selective:"SELECTIVE",proofonly:"PROOF-ONLY",cascade:"CASCADE"};
const SDA_BORDERS={full:"solid",selective:"dashed",proofonly:"dotted",cascade:"dashed"};

/* Primitives */
function Backdrop({children,onClose}){
  useEffect(()=>{const h=e=>{if(e.key==="Escape"){e.stopPropagation();onClose?.()}};window.addEventListener("keydown",h,true);return()=>window.removeEventListener("keydown",h,true)},[onClose]);
  return <div onClick={e=>{if(e.target===e.currentTarget)onClose?.()}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,animation:"fade-in 200ms ease"}}>
    <style>{`@keyframes fade-in{from{opacity:0}to{opacity:1}} @keyframes modal-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}`}</style>
    {children}
  </div>;
}
function Modal({children,width=720}){
  return <div style={{width,maxWidth:"94vw",maxHeight:"90vh",background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,display:"flex",flexDirection:"column",overflow:"hidden",animation:"modal-up 250ms ease",boxShadow:"0 24px 80px rgba(0,0,0,.5)"}}>{children}</div>;
}
function ModalHeader({title,subtitle,step,totalSteps,onClose}){
  return <div style={{padding:"22px 28px 18px",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:subtitle?8:0}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <span style={{fontSize:18,fontWeight:700,color:T.text}}>{title}</span>
        {step!=null&&totalSteps&&<span style={{fontSize:11,fontFamily:M,color:T.textDim,padding:"3px 10px",background:T.raised,borderRadius:10}}>Step {step} of {totalSteps}</span>}
      </div>
      <button onClick={onClose} style={{background:"none",border:"none",fontSize:16,color:T.textDim,cursor:"pointer",padding:"4px 8px",borderRadius:4}} onMouseEnter={e=>e.target.style.color=T.text} onMouseLeave={e=>e.target.style.color=T.textDim}>{"\u2715"}</button>
    </div>
    {subtitle&&<div style={{fontSize:13,color:T.textMut,lineHeight:1.6}}>{subtitle}</div>}
  </div>;
}
function ModalBody({children}){return <div style={{flex:1,overflow:"auto",padding:"22px 28px"}}>{children}</div>;}
function ModalFooter({children}){return <div style={{padding:"18px 28px",borderTop:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,background:T.card}}>{children}</div>;}
function Btn({label,onClick,accent,disabled,purple,style:sx}){
  const[h,sh]=useState(false);
  const baseC=purple?T.purple:accent?T.accent:null;
  const bg=disabled?"transparent":baseC?(h?`color-mix(in srgb,${baseC} 85%,#fff)`:baseC):h?T.cardAlt:"transparent";
  const c=disabled?T.textFaint:baseC?"#fff":h?T.text:T.textMut;
  const bc=disabled?T.border:baseC||T.border;
  return <button onClick={disabled?undefined:onClick} onMouseEnter={()=>!disabled&&sh(true)} onMouseLeave={()=>sh(false)} style={{height:38,padding:"0 20px",borderRadius:6,border:`1px solid ${bc}`,background:bg,color:c,fontSize:13,fontFamily:F,fontWeight:600,cursor:disabled?"default":"pointer",transition:"all 150ms",opacity:disabled?.4:1,whiteSpace:"nowrap",...(sx||{})}}>{label}</button>;
}
function InfoRow({label,value}){
  return <div style={{display:"flex",alignItems:"flex-start",minHeight:34,borderBottom:`1px solid ${T.border}`}}>
    <div style={{width:150,flexShrink:0,fontSize:12,color:T.textDim,paddingLeft:4,paddingTop:8}}>{label}</div>
    <div style={{flex:1,fontSize:12,color:T.textMut,paddingTop:8,paddingBottom:8}}>{value}</div>
  </div>;
}
function CopyBadge({value}){
  const[c,sc]=useState(false);
  return <span onClick={e=>{e.stopPropagation();navigator.clipboard?.writeText(value);sc(true);setTimeout(()=>sc(false),1500)}} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 9px",borderRadius:4,background:T.raised,border:`1px solid ${T.border}`,fontFamily:M,fontSize:11,color:c?T.green:T.textDim,cursor:"pointer",transition:"color 150ms",userSelect:"none"}}>{c?"\u2713 Copied":value}</span>;
}
const SDA_TIPS={
  full:"Full Disclosure: evaluators can extract data fields and run inference requirements against the evidence.",
  selective:"Selective Disclosure: evaluators can run inference requirements but cannot extract raw data from the evidence.",
  proofonly:"Proof-only Disclosure: shares only the pass/fail result of a completed evaluation. No access to evidence is granted.",
  cascade:"Cascade Disclosure: access through an intermediary. Permission is capped at the lower of the upstream and downstream agreements.",
};
function SDABadge({type,tip}){
  const c=SDA_COLORS[type]||T.accent;const l=SDA_LABELS[type]||"FULL";const b=SDA_BORDERS[type]||"solid";
  const badge=<span style={{padding:"3px 8px",borderRadius:4,fontSize:10.5,fontFamily:M,fontWeight:600,background:`color-mix(in srgb,${c} 10%,transparent)`,color:c,border:`1px ${b} color-mix(in srgb,${c} 45%,transparent)`,whiteSpace:"nowrap"}}>{l}</span>;
  return tip?<Tip text={SDA_TIPS[type]||""}>{badge}</Tip>:badge;
}
function LevelInline({type,tip}){
  const el=<span style={{fontFamily:M,fontWeight:600,color:SDA_COLORS[type]||T.accent,fontSize:12,borderBottom:tip?`1px dashed color-mix(in srgb,${SDA_COLORS[type]||T.accent} 35%,transparent)`:"none",cursor:tip?"default":"inherit"}}>{SDA_LABELS[type]||"FULL"}</span>;
  return tip?<Tip text={SDA_TIPS[type]||""}>{el}</Tip>:el;
}
function StepDots({current,total}){
  return <div style={{display:"flex",gap:6,alignItems:"center"}}>
    {Array.from({length:total},(_,i)=><div key={i} style={{width:i===current?20:6,height:6,borderRadius:3,background:i===current?T.purple:i<current?T.green:T.borderLt,transition:"all 200ms"}}/>)}
  </div>;
}
function ChainIcon({s=14}){
  return <svg width={s} height={s} viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5l3-3" stroke={T.purple} strokeWidth="1.2" strokeLinecap="round"/><path d="M9 7l2.5-2.5a1.5 1.5 0 00-2.12-2.12L7 4.75" stroke={T.purple} strokeWidth="1.2" strokeLinecap="round"/><path d="M7 9l-2.5 2.5a1.5 1.5 0 002.12 2.12L9 11.25" stroke={T.purple} strokeWidth="1.2" strokeLinecap="round"/></svg>;
}
const CAT={
  person:{icon:"\u25CF",color:T.cyan,label:"PERSON"},
  party:{icon:"\u2B21",color:T.indigo,label:"PARTY"},
  place:{icon:"\u25C6",color:T.green,label:"PLACE"},
  product:{icon:"\u25A0",color:T.blue,label:"PRODUCT"},
  process:{icon:"\u25CE",color:T.amber,label:"PROCESS"},
};
function Tip({text,children}){
  const[show,setShow]=useState(false);
  const ref=React.useRef(null);
  const[pos,setPos]=useState(null);
  const enter=()=>{setShow(true);if(ref.current){const r=ref.current.getBoundingClientRect();setPos({x:r.left+r.width/2,y:r.bottom+6})}};
  return <span ref={ref} onMouseEnter={enter} onMouseLeave={()=>setShow(false)} style={{display:"inline-flex",alignItems:"center",cursor:"default"}}>
    {children}
    {show&&pos&&ReactDOM.createPortal(
      <div style={{position:"fixed",left:Math.max(8,pos.x-140),top:pos.y,width:280,padding:"10px 12px",background:T.card,border:`1px solid ${T.borderLt}`,borderRadius:6,fontSize:11,color:T.textSec,lineHeight:1.6,zIndex:9999,boxShadow:"0 8px 24px rgba(0,0,0,.4)",pointerEvents:"none"}}>{text}</div>,
      document.body
    )}
  </span>;
}

/* Demo data */
const UPSTREAM=[
  {id:"cap-array",name:"Ceramic Capacitor Array",pin:"PIN-0x2d7c...b5f0",category:"product",owner:"Murata Manufacturing",ownerDot:"DOT-0x9f1b...c2e8",upstreamSdaType:"selective",cascadePolicy:"open"},
  {id:"vreg-ic",name:"Voltage Regulator IC",pin:"PIN-0x8a4e...c1d9",category:"product",owner:"Texas Instruments",ownerDot:"DOT-0x3b7f...a4d2",upstreamSdaType:"full",cascadePolicy:"open"},
  {id:"pcb-sub",name:"PCB Substrate",pin:"PIN-0xb3f2...e7a6",category:"product",owner:"Isola Group",ownerDot:"DOT-0x6e2a...d8c1",upstreamSdaType:"selective",cascadePolicy:"closed"},
];
const EXISTING_CASCADES=[{id:"cap-array",to:"GovCo"}];
const PARENT={name:"Power Regulation Module",pin:"PIN-0x5e9a...d4c3"};
const DS={name:"GovCo",dot:"DOT-0x7a3f...e1b2"};
const DS_LEVEL="selective";

function getEffective(up,down){
  const o=["proofonly","selective","full"];
  return o[Math.min(o.indexOf(up),o.indexOf(down))];
}

/* ═══════════════════════════════════════════════════════════════════════
   UPSTREAM ASSET PICKER — reordered layout
   Row 1: [checkbox] [chain icon] Disclose this Asset  ... OPEN/CLOSED badge
   Row 2: Asset name + PIN
   Row 3: Owner name + DOT
   ═══════════════════════════════════════════════════════════════════════ */
function UpstreamPicker({assets,selected,setSelected,downstreamLevel,alreadyIds}){
  const toggle=id=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const done=alreadyIds||[];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    {assets.map(a=>{
      const isOpen=a.cascadePolicy==="open";
      const isSel=selected.includes(a.id);
      const isDone=done.includes(a.id);
      const off=!isOpen;
      const[hov,setHov]=useState(false);

      return <div key={a.id}
        onClick={off||isDone?undefined:()=>toggle(a.id)}
        onMouseEnter={()=>!off&&!isDone&&setHov(true)}
        onMouseLeave={()=>setHov(false)}
        style={{
          padding:"18px 20px",borderRadius:10,position:"relative",
          border:`1.5px solid ${isDone?T.green:isSel?T.purple:hov?T.borderLt:T.border}`,
          background:isDone?`color-mix(in srgb,${T.green} 4%,transparent)`:isSel?`color-mix(in srgb,${T.purple} 5%,transparent)`:hov?T.cardAlt:T.card,
          cursor:off||isDone?"default":"pointer",transition:"all 150ms",opacity:off?.45:1,
        }}>

        {/* Policy badge top-right with tooltip */}
        <div style={{position:"absolute",top:12,right:14}}>
          <Tip text={isOpen
            ?`${a.owner} has permitted ${SDA_LABELS[a.upstreamSdaType].toLowerCase()} disclosure of this asset to all parties connected to your asset. ${a.owner} may revoke their disclosure at any time.`
            :`${a.owner} has not permitted disclosure of their asset to other parties. To enable disclosure of this asset, contact ${a.owner} to request a policy change.`
          }>
            <span style={{fontSize:9,fontFamily:M,fontWeight:700,letterSpacing:"0.04em",
              color:isOpen?T.green:T.textFaint,
              padding:"2px 8px",borderRadius:5,
              background:isOpen?`color-mix(in srgb,${T.green} 8%,transparent)`:`color-mix(in srgb,${T.textFaint} 8%,transparent)`,
              border:`1px solid ${isOpen?`color-mix(in srgb,${T.green} 20%,transparent)`:`color-mix(in srgb,${T.textFaint} 15%,transparent)`}`,
            }}>{isOpen?"OPEN":"CLOSED"}</span>
          </Tip>
        </div>

        <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
          {/* Checkbox */}
          {isDone?
            <div style={{width:20,height:20,borderRadius:5,background:T.green,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}><span style={{fontSize:12,color:"#fff"}}>{"\u2713"}</span></div>
          :off?
            <div style={{width:20,height:20,borderRadius:5,border:`1.5px solid ${T.borderLt}`,flexShrink:0,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:11,color:T.textFaint}}>{"\u2715"}</span></div>
          :
            <div style={{width:20,height:20,borderRadius:5,border:`1.5px solid ${isSel?T.purple:T.borderLt}`,background:isSel?T.purple:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 150ms",flexShrink:0,marginTop:2}}>
              {isSel&&<span style={{fontSize:12,color:"#fff"}}>{"\u2713"}</span>}
            </div>
          }

          <div style={{flex:1}}>
            {/* Row 1: action label */}
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
              {isDone?<>
                <ChainIcon s={13}/>
                <span style={{fontSize:12,fontFamily:M,fontWeight:600,color:T.green}}>Cascading to {DS.name}</span>
              </>:off?<>
                <span style={{fontSize:12,fontFamily:M,color:T.textFaint}}>Cannot disclose this asset</span>
              </>:<>
                <ChainIcon s={13}/>
                <span style={{fontSize:12,fontFamily:M,fontWeight:600,color:isSel?T.purple:hov?T.textSec:T.textMut,transition:"color 150ms"}}>Disclose this asset</span>
              </>}
            </div>

            {/* Row 2: category */}
            {(()=>{const cat=CAT[a.category]||CAT.product;return <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
              <span style={{fontSize:9,color:cat.color,position:"relative",top:-0.5}}>{cat.icon}</span>
              <span style={{fontSize:10,fontFamily:M,fontWeight:700,color:cat.color,letterSpacing:"0.06em"}}>{cat.label}</span>
            </div>})()}

            {/* Row 3: name + PIN */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={{fontSize:14,fontWeight:600,color:off?T.textDim:T.text}}>{a.name}</span>
              <CopyBadge value={a.pin}/>
            </div>

            {/* Row 4: owner + DOT */}
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:12,color:T.textDim}}>{a.owner}</span>
              <CopyBadge value={a.ownerDot}/>
            </div>
          </div>
        </div>
      </div>;
    })}
  </div>;
}

/* ═══════════════════════════════════════════════════════════════════════
   ENTRY A — AT DISCLOSURE TIME
   ═══════════════════════════════════════════════════════════════════════ */
function EntryA({onClose}){
  const[step,setStep]=useState(0);
  const[selected,setSelected]=useState([]);
  const[completed,setCompleted]=useState(false);

  if(completed){
    return <Backdrop onClose={onClose}><Modal width={560}>
      <div style={{padding:"52px 36px",textAlign:"center"}}>
        <div style={{width:60,height:60,borderRadius:"50%",background:`color-mix(in srgb,${T.purple} 12%,transparent)`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 22px",border:`2px solid ${T.purple}`}}><ChainIcon s={28}/></div>
        <div style={{fontSize:18,fontWeight:700,color:T.text,marginBottom:10}}>Disclosure Created</div>
        <div style={{fontSize:13,color:T.textMut,lineHeight:1.6,marginBottom:28}}>
          A <LevelInline type={DS_LEVEL} tip/> disclosure has been created with {DS.name} for {PARENT.name}{selected.length>0?`, including ${selected.length} cascading asset${selected.length!==1?"s":""}`:""}.
        </div>
        <div style={{padding:"14px 18px",background:T.card,borderRadius:8,border:`1px solid ${T.border}`,marginBottom:28,textAlign:"left"}}>
          <InfoRow label="Asset" value={PARENT.name}/>
          <InfoRow label="To" value={DS.name}/>
          <InfoRow label="Permission" value={<LevelInline type={DS_LEVEL} tip/>}/>
          {selected.length>0&&<InfoRow label="Cascading assets" value={<div style={{display:"flex",flexDirection:"column",gap:6}}>
            {selected.map(id=>{const a=UPSTREAM.find(x=>x.id===id);const eff=getEffective(a?.upstreamSdaType,DS_LEVEL);return <div key={id} style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:600,color:T.text}}>{a?.name}</span><span style={{color:T.textDim}}>({a?.owner})</span><SDABadge type={eff} tip/></div>})}
          </div>}/>}
        </div>
        <Btn label="Done" purple onClick={onClose}/>
      </div>
    </Modal></Backdrop>;
  }

  return <Backdrop onClose={onClose}><Modal>
    <ModalHeader title="Respond to Disclosure Request" subtitle={<span>From {DS.name} {"\u00B7"} Accepted as <LevelInline type={DS_LEVEL} tip/></span>} step={step+1} totalSteps={2} onClose={onClose}/>
    <ModalBody>
      {step===0&&<div>
        <div style={{padding:"14px 16px",background:`color-mix(in srgb,${SDA_COLORS[DS_LEVEL]} 6%,transparent)`,border:`1px solid color-mix(in srgb,${SDA_COLORS[DS_LEVEL]} 25%,transparent)`,borderRadius:8,marginBottom:24,display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:SDA_COLORS[DS_LEVEL],flexShrink:0}}/>
          <div style={{fontSize:12,color:T.textMut}}>You are creating a <LevelInline type={DS_LEVEL} tip/> disclosure with {DS.name} for {PARENT.name}.</div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <ChainIcon s={20}/>
          <span style={{fontSize:20,fontWeight:700,color:T.text}}>Disclose connected assets?</span>
        </div>
        <div style={{fontSize:13,color:T.textDim,marginBottom:24,lineHeight:1.7}}>
          <div style={{marginBottom:12}}>Cascading disclosures enable you to disclose your connected assets to other parties. Permissions are capped at the lesser of your disclosure agreements.</div>
          <div><strong style={{color:T.text}}>{PARENT.name}</strong> is connected to <strong style={{color:T.text}}>{UPSTREAM.length}</strong> other assets that you can choose to include in this disclosure as Cascading Assets. Cascading Assets will be revealed to <strong style={{color:T.text}}>{DS.name}</strong>'s network under <strong style={{color:T.text}}>{PARENT.name}</strong>.</div>
        </div>

        <UpstreamPicker assets={UPSTREAM} selected={selected} setSelected={setSelected} downstreamLevel={DS_LEVEL}/>
        <div style={{marginTop:18,fontSize:11,color:T.textDim,lineHeight:1.6}}>
          Assets with a closed cascade policy cannot be forwarded. Contact the upstream owner to request a policy change.
        </div>
      </div>}

      {step===1&&<div>
        <div style={{padding:"18px 20px",background:T.card,borderRadius:8,border:`1px solid ${T.border}`}}>
          <div style={{fontSize:11,fontFamily:M,fontWeight:700,color:T.textDim,letterSpacing:"0.04em",marginBottom:14}}>DISCLOSURE SUMMARY</div>
          <InfoRow label="Asset" value={<span style={{fontWeight:600,color:T.text}}>{PARENT.name}</span>}/>
          <InfoRow label="To" value={DS.name}/>
          <InfoRow label="Permission" value={<LevelInline type={DS_LEVEL} tip/>}/>

          {selected.length>0&&<>
            <div style={{marginTop:18,marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
              <ChainIcon s={14}/>
              <span style={{fontSize:11,fontFamily:M,fontWeight:700,color:T.purple,letterSpacing:"0.04em"}}>CASCADING ASSETS ({selected.length})</span>
            </div>
            {selected.map(id=>{const a=UPSTREAM.find(x=>x.id===id);const eff=getEffective(a?.upstreamSdaType,DS_LEVEL);return <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:`1px solid ${T.border}`}}>
              <div><div style={{fontSize:13,fontWeight:600,color:T.text}}>{a?.name}</div><div style={{fontSize:11,color:T.textDim}}>{a?.owner}</div></div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><SDABadge type={eff} tip/><span style={{fontSize:10,color:T.textDim}}>via cascade</span></div>
            </div>})}
          </>}

          {selected.length===0&&<div style={{marginTop:16,padding:"14px 16px",background:T.raised,borderRadius:6,fontSize:12,color:T.textDim,lineHeight:1.6}}>
            No cascading assets selected. The disclosure will cover only {PARENT.name}. You can add cascading disclosures later from the Disclosures tab.
          </div>}

          <div style={{marginTop:18,fontSize:12,color:T.textDim,lineHeight:1.7}}>
            This creates a bilateral <LevelInline type={DS_LEVEL} tip/> disclosure with {DS.name}, recorded on-chain.{selected.length>0?` ${selected.length} cascading disclosure${selected.length>1?"s":""} will also be created. Either the upstream owner or you can revoke a cascading disclosure independently at any time.`:""}
          </div>
        </div>
      </div>}
    </ModalBody>
    <ModalFooter>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        {step>0&&<Btn label={"\u2190 Back"} onClick={()=>setStep(0)}/>}
        <StepDots current={step} total={2}/>
      </div>
      {step===0&&<Btn
        label={selected.length>0?`Review (${selected.length} cascading)`:"Skip \u2014 No Cascading Assets"}
        purple={selected.length>0} accent={selected.length===0}
        onClick={()=>setStep(1)}
      />}
      {step===1&&<Btn label="Create Disclosure" purple onClick={()=>setCompleted(true)}/>}
    </ModalFooter>
  </Modal></Backdrop>;
}

/* ═══════════════════════════════════════════════════════════════════════
   ENTRY B — MANAGE CASCADING DISCLOSURES ON EXISTING SDA
   ═══════════════════════════════════════════════════════════════════════ */
function EntryB({onClose}){
  const[selected,setSelected]=useState([]);
  const[step,setStep]=useState(0);
  const[completed,setCompleted]=useState(false);
  const alreadyIds=EXISTING_CASCADES.filter(c=>c.to===DS.name).map(c=>c.id);

  if(completed){
    return <Backdrop onClose={onClose}><Modal width={560}>
      <div style={{padding:"52px 36px",textAlign:"center"}}>
        <div style={{width:60,height:60,borderRadius:"50%",background:`color-mix(in srgb,${T.purple} 12%,transparent)`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 22px",border:`2px solid ${T.purple}`}}><ChainIcon s={28}/></div>
        <div style={{fontSize:18,fontWeight:700,color:T.text,marginBottom:10}}>Cascading Disclosures Updated</div>
        <div style={{fontSize:13,color:T.textMut,lineHeight:1.6,marginBottom:28}}>
          {selected.length>0?<>{selected.length} new cascading disclosure{selected.length>1?"s":""} added to your agreement with {DS.name}.</>:"No changes made."}
        </div>
        {selected.length>0&&<div style={{padding:"14px 18px",background:T.card,borderRadius:8,border:`1px solid ${T.border}`,marginBottom:24,textAlign:"left"}}>
          {selected.map(id=>{const a=UPSTREAM.find(x=>x.id===id);const eff=getEffective(a?.upstreamSdaType,DS_LEVEL);return <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${T.border}`}}>
            <div><div style={{fontSize:13,fontWeight:600,color:T.text}}>{a?.name}</div><div style={{fontSize:11,color:T.textDim}}>{a?.owner}</div></div>
            <SDABadge type={eff} tip/>
          </div>})}
          <div style={{marginTop:14,fontSize:12,color:T.textDim,lineHeight:1.7}}>
            You can manage cascading disclosures at any time from the Disclosures tab on {PARENT.name}'s Detail Panel.
          </div>
        </div>}
        <Btn label="Done" purple onClick={onClose}/>
      </div>
    </Modal></Backdrop>;
  }

  return <Backdrop onClose={onClose}><Modal>
    <ModalHeader title="Manage Cascading Disclosures" subtitle={<span>{PARENT.name} {"\u2192"} {DS.name} (<LevelInline type={DS_LEVEL} tip/>)</span>} step={step+1} totalSteps={2} onClose={onClose}/>
    <ModalBody>
      {step===0&&<div>
        <div style={{padding:"14px 16px",background:`color-mix(in srgb,${T.purple} 5%,transparent)`,border:`1px solid color-mix(in srgb,${T.purple} 20%,transparent)`,borderRadius:8,marginBottom:22,fontSize:12,color:T.textMut,lineHeight:1.7}}>
          <strong style={{color:T.purple}}>Active SDA:</strong> You have a <LevelInline type={DS_LEVEL} tip/> disclosure with {DS.name} for {PARENT.name}. Select additional connected assets to cascade through this agreement.
        </div>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <ChainIcon s={20}/>
          <span style={{fontSize:20,fontWeight:700,color:T.text}}>Disclose connected assets</span>
        </div>
        <div style={{fontSize:13,color:T.textDim,marginBottom:22,lineHeight:1.7}}>
          Cascading disclosures to {DS.name} are shown in green. Select additional assets to include. {PARENT.name} is connected to {UPSTREAM.length} other assets total.
        </div>

        <UpstreamPicker assets={UPSTREAM} selected={selected} setSelected={setSelected} downstreamLevel={DS_LEVEL} alreadyIds={alreadyIds}/>
      </div>}

      {step===1&&<div>
        <div style={{padding:"18px 20px",background:T.card,borderRadius:8,border:`1px solid ${T.border}`}}>
          <div style={{fontSize:11,fontFamily:M,fontWeight:700,color:T.textDim,letterSpacing:"0.04em",marginBottom:14}}>CASCADE CHANGES</div>

          {alreadyIds.length>0&&<>
            <div style={{fontSize:11,fontFamily:M,color:T.green,marginBottom:10}}>EXISTING ({alreadyIds.length})</div>
            {alreadyIds.map(id=>{const a=UPSTREAM.find(x=>x.id===id);return <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${T.border}`,opacity:.6}}>
              <span style={{fontSize:12,color:T.textMut}}>{a?.name} ({a?.owner})</span>
              <span style={{fontSize:10,fontFamily:M,color:T.green}}>Active</span>
            </div>})}
            <div style={{height:18}}/>
          </>}

          {selected.length>0&&<>
            <div style={{fontSize:11,fontFamily:M,color:T.purple,marginBottom:10}}>ADDING ({selected.length})</div>
            {selected.map(id=>{const a=UPSTREAM.find(x=>x.id===id);const eff=getEffective(a?.upstreamSdaType,DS_LEVEL);return <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:`1px solid ${T.border}`}}>
              <div><div style={{fontSize:13,fontWeight:600,color:T.text}}>{a?.name}</div><div style={{fontSize:11,color:T.textDim}}>{a?.owner}</div></div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><SDABadge type={eff} tip/><span style={{fontSize:10,color:T.purple,fontFamily:M}}>NEW</span></div>
            </div>})}
          </>}

          {selected.length===0&&<div style={{padding:"14px 16px",background:T.raised,borderRadius:6,fontSize:12,color:T.textDim,lineHeight:1.6}}>
            No new cascading assets selected. All available assets are either already cascading or have a closed policy.
          </div>}

          <div style={{marginTop:18,fontSize:12,color:T.textDim,lineHeight:1.7}}>
            New cascading disclosures will be recorded on-chain. {DS.name} will be notified of newly available assets. Either the upstream owner or you can revoke a cascading disclosure independently at any time.
          </div>
        </div>
      </div>}
    </ModalBody>
    <ModalFooter>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        {step>0&&<Btn label={"\u2190 Back"} onClick={()=>setStep(0)}/>}
        <StepDots current={step} total={2}/>
      </div>
      {step===0&&<Btn label={selected.length>0?`Review Changes (${selected.length})`:"No Changes"} purple={selected.length>0} disabled={selected.length===0} onClick={()=>setStep(1)}/>}
      {step===1&&<Btn label={`Add ${selected.length} Cascading Disclosure${selected.length>1?"s":""}`} purple onClick={()=>setCompleted(true)}/>}
    </ModalFooter>
  </Modal></Backdrop>;
}

/* App */
function App(){
  const[active,setActive]=useState(null);
  return <div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:F,padding:"36px 28px"}}>
    <div style={{maxWidth:740,margin:"0 auto"}}>
      <h1 style={{fontSize:24,fontWeight:700,letterSpacing:"-0.02em",marginBottom:8}}>Cascade Disclosure {"\u2014"} Reference</h1>
      <p style={{fontSize:14,color:T.textMut,marginBottom:36,lineHeight:1.6}}>Two entry points for forwarding connected upstream assets through an intermediary to a downstream party.</p>

      <div style={{background:T.card,borderRadius:8,border:`1px solid ${T.border}`,padding:"18px 20px",marginBottom:24}}>
        <div style={{fontSize:11,fontFamily:M,fontWeight:700,color:T.textDim,letterSpacing:"0.04em",marginBottom:12}}>DEMO SCENARIO</div>
        <div style={{fontSize:13,color:T.textMut,lineHeight:1.7}}>
          <strong style={{color:T.text}}>MicroCo</strong> (you, the intermediary) owns {PARENT.name}. It has 3 connected upstream assets: Ceramic Capacitor Array (Murata, open), Voltage Regulator IC (Texas Instruments, open), and PCB Substrate (Isola Group, closed). <strong style={{color:T.text}}>GovCo</strong> is the downstream buyer.
        </div>
      </div>

      <div style={{background:T.surface,borderRadius:12,border:`1px solid ${T.border}`,padding:28,marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:T.purple}}/>
          <span style={{fontSize:15,fontWeight:600}}>Entry A {"\u2014"} At Disclosure Time</span>
          <span style={{fontSize:11,fontFamily:M,color:T.textDim,padding:"3px 10px",background:T.raised,borderRadius:10}}>FLOW B RESPONSE</span>
        </div>
        <p style={{fontSize:13,color:T.textMut,lineHeight:1.7,marginBottom:18}}>After accepting a disclosure request and setting terms, the seller sees an optional step to include connected upstream assets. Added as the final step before confirmation in the Flow B response modal.</p>
        <Btn label="Open Entry A" purple onClick={()=>setActive("a")}/>
      </div>

      <div style={{background:T.surface,borderRadius:12,border:`1px solid ${T.border}`,padding:28,marginBottom:22}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:T.purple}}/>
          <span style={{fontSize:15,fontWeight:600}}>Entry B {"\u2014"} Manage Existing Cascades</span>
          <span style={{fontSize:11,fontFamily:M,color:T.textDim,padding:"3px 10px",background:T.raised,borderRadius:10}}>DISCLOSURES TAB</span>
        </div>
        <p style={{fontSize:13,color:T.textMut,lineHeight:1.7,marginBottom:18}}>From an active SDA in the Disclosures tab, the seller manages which connected assets are cascaded. One asset (Ceramic Capacitor Array) is pre-cascaded to show the active state.</p>
        <Btn label="Open Entry B" purple onClick={()=>setActive("b")}/>
      </div>

      <div style={{background:T.surface,borderRadius:12,border:`1px solid ${T.border}`,padding:28}}>
        <h2 style={{fontSize:15,fontWeight:600,marginBottom:14}}>Architecture Notes</h2>
        <div style={{fontSize:12,color:T.textMut,lineHeight:1.8}}>
          <p style={{marginBottom:10}}><strong style={{color:T.text}}>Two-layer decision:</strong> Upstream owner sets cascade policy (open/closed). Intermediary decides which open-policy assets to cascade to each downstream party.</p>
          <p style={{marginBottom:10}}><strong style={{color:T.text}}>Permission math:</strong> Cascading disclosure level = min(upstream SDA, downstream SDA). Always capped at the lower of the two agreements.</p>
          <p style={{marginBottom:10}}><strong style={{color:T.text}}>Two failure points:</strong> Either the upstream owner or the intermediary can revoke. Upstream revocation kills all downstream cascades through that SDA. Intermediary revocation removes only the specific cascade.</p>
          <p><strong style={{color:T.text}}>Closed policy</strong> prevents forwarding entirely. Requesting a change is an off-platform conversation.</p>
        </div>
      </div>
    </div>
    {active==="a"&&<EntryA onClose={()=>setActive(null)}/>}
    {active==="b"&&<EntryB onClose={()=>setActive(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
